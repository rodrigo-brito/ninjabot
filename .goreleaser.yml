# GoReleaser v2 configuration
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/ninjabot
    id: "ninjabot"
    binary: ninjabot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Ignore arm64 on Windows (not commonly supported)
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
    - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'
  # The dashboard bundle is verified against this file by ui/bundle.go.
  extra_files:
    - glob: ./web/ninjabot-ui.tar.gz

release:
  extra_files:
    - glob: ./web/ninjabot-ui.tar.gz

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'
